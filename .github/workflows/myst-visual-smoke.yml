name: Myst Visual Smoke (mock Telegram)
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/webapp/**'
      - 'lib/mystAssetReadiness.mjs'
      - 'next.config.mjs'
      - 'scripts/myst-visual-smoke.mjs'
      - 'scripts/myst-startup-recovery-smoke.mjs'
      - '.github/workflows/myst-visual-smoke.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx eslint app/webapp/BootLoader.jsx app/webapp/RouteSkeleton.jsx lib/mystAssetReadiness.mjs scripts/myst-visual-smoke.mjs scripts/myst-startup-recovery-smoke.mjs app/webapp/error.jsx
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Browser test (mocked auth/data only)
        run: |
          npm run start -- -p 3000 > /tmp/newpro-browser-server.log 2>&1 &
          node scripts/myst-visual-smoke.mjs
          node scripts/myst-startup-recovery-smoke.mjs
          BROWSER_ENGINE=webkit node scripts/myst-startup-recovery-smoke.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: myst-smoke-screenshots
          path: artifacts/myst-smoke/
          if-no-files-found: ignore
          retention-days: 5
